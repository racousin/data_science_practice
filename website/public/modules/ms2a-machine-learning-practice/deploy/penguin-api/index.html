<!doctype html>
<html>
<head><meta charset="utf-8"><title>Penguin species</title></head>
<body>
  <h1>Which penguin?</h1>
  <form id="form">
    <label>Bill length (mm) <input name="bill_length_mm" type="number" step="any" value="39.1"></label><br>
    <label>Bill depth (mm) <input name="bill_depth_mm" type="number" step="any" value="18.7"></label><br>
    <label>Flipper length (mm) <input name="flipper_length_mm" type="number" step="any" value="181"></label><br>
    <label>Body mass (g) <input name="body_mass_g" type="number" step="any" value="3750"></label><br>
    <button>Predict</button>
  </form>
  <p id="out"></p>
  <script>
    document.getElementById("form").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const r = await fetch("/predict", {method: "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
      document.getElementById("out").textContent = (await r.json()).species;
    };
  </script>
</body>
</html>
