services:
  api:
    build: ..        # the Dockerfile is one folder up
    deploy:
      replicas: 3
    restart: unless-stopped
    healthcheck:
      test: >-
        python -c "import urllib.request as r;
        r.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
