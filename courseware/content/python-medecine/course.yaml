# Python pour la médecine — 8 séances de 3h
#
# Single source of truth for this course. Drives two outputs:
#   * PPTX decks      -> tools/build_slides.py    (one deck per module below)
#   * ML-Arena course -> tools/publish_mlarena.py (course / module / lesson rows)
#
# Built 2026-10-15 from the ISIR course *Python-Master-Actuariat*
# (git.isir.upmc.fr:scai/scai-formation/Python-Master-Actuariat, parts 1-5 and
# TD/TP1-3), rewritten in French around medical examples, and from
# github.com/bgregorutti/python-project (the Puissance 4 project, exercises 1-5).
#
# Module slugs carry a `pym-` prefix: the publisher finds an existing module by
# slug across every module of the account, and `s1-…` slugs are taken by the
# other two courses.
#
# Every session = lessons (slides, `---` separated) + one exercise page that
# opens a Colab notebook. Notebooks are generated by
# tools/notebooks/pym_*.py into ai_for_medicine/python-medecine/notebooks/ (an
# exercise notebook and its `-correction` twin), datasets by
# tools/notebooks/pym_datasets.py into …/python-medecine/donnees/; the checkout
# of github.com/racousin/ai_for_medicine sits at the repo root (gitignored), see
# tools/notebooks/aim_repo.py.

course:
  name: "Python pour la médecine"
  code: "PYMED-2026"
  slug: python-medecine
  visibility: public
  instructor_name: "Raphael Cousin"
  # PLACEHOLDER — no term dates were given; the end date is far enough out that
  # the enrol route (410 after end_date) stays open for the school year.
  start_date: "2026-10-19"
  end_date: "2027-07-31"
  description: |
    Un cours d'initiation à Python pour les étudiants et professionnels de
    santé, en huit séances de trois heures. Aucun prérequis en programmation.

    On apprend le langage (types, structures de contrôle, fonctions,
    structures de données, objets, modules), puis les outils de l'analyse de
    données : NumPy, pandas, Matplotlib et seaborn, sur des données médicales
    réelles (insuffisance cardiaque, hospitalisations COVID-19) et sur des
    exports hospitaliers à nettoyer. La dernière séance apprend à écrire du
    code de qualité : packages, tests unitaires, conventions.

    Chaque séance alterne cours et exercices dans Google Colab, avec une
    correction. Le projet final, en binôme, consiste à programmer un joueur de
    Puissance 4 et à le confronter à ceux des autres groupes sur ML-Arena.

