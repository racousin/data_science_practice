# IA pour la médecine — DFGSM2, 3 séances de TP + un projet
#
# Single source of truth for this course. Drives two outputs:
#   * PPTX decks      -> tools/build_slides.py    (one deck per module below)
#   * ML-Arena course -> tools/publish_mlarena.py (course / module / lesson rows)
#
# Built 2026-10-15 from github.com/racousin/DFGSM2-IA-S2 (sessions 1-3, the
# bonus gradient-descent TP, the SUPPORT2 project, slides "Course 1 DS"),
# rewritten in French.
#
# Module slugs carry an `iam-` prefix: the publisher finds an existing module by
# slug across every module of the account.
#
# Every session = lessons (slides, `---` separated) + the TP page (a Colab
# notebook and its correction) + the session's challenge page. Each session has
# its own copy of challenge 172 (SUPPORT2, alive/dead at 2 months, accuracy),
# so every session's model gets its own leaderboard:
# competitions/iam-survie/ (one script, ids in its state.json). Notebooks are generated by
# tools/notebooks/iam_s*.py into ai_for_medicine/ia-medecine/notebooks/
# (github.com/racousin/ai_for_medicine); data lives in …/ia-medecine/donnees/.

course:
  name: "IA pour la médecine"
  code: "IAMED-2026"
  slug: ia-medecine
  visibility: public
  instructor_name: "Raphael Cousin"
  # PLACEHOLDER — no term dates were given; the end date is far enough out that
  # the enrol route (410 after end_date) stays open for the school year.
  start_date: "2026-10-19"
  end_date: "2027-07-31"
  description: |
    Une introduction à l'apprentissage automatique pour les étudiants en
    deuxième année de médecine (DFGSM2), en trois séances de travaux pratiques
    et un projet.

    Chaque séance suit la même méthode : explorer, visualiser, préparer,
    entraîner, évaluer. On y voit la régression logistique, la préparation de
    données imparfaites et les forêts aléatoires, puis les réseaux de neurones,
    sur des données médicales (cancer du sein, maladie cardiaque, patients de
    réanimation de l'étude SUPPORT2).

    Chaque séance se termine par un défi sur ML-Arena : prédire la survie à
    2 mois de patients de réanimation avec le modèle du jour, et comparer son
    score à ceux de la promotion.

modules:
  # ---------------------------------------------------------------- session 1
  # Source: slides "Course 1 DS" + session1/tp1.ipynb.
  - title: "Séance 1 — Apprentissage automatique et classification"
    slug: iam-s1-classification
    icon: rocket
    visibility: unlisted
    summary: >
      Ce qu'est l'apprentissage automatique : données, modèle, fonction de
      perte, descente de gradient ; la régression logistique et l'évaluation
      d'un classifieur (matrice de confusion, précision, rappel, F1).
    competitions:
      - competition_id: 199
        label: "Survie à 2 mois — défi de la séance 1"
    lessons:
      - title: "Apprendre à partir de données"
        slug: apprendre-a-partir-de-donnees
        file: iam-s1-classification/apprendre-a-partir-de-donnees.md
        estimated_minutes: 25
        is_published: true
      - title: "Modèle, fonction de perte et descente de gradient"
        slug: modele-perte-gradient
        file: iam-s1-classification/modele-perte-gradient.md
        estimated_minutes: 25
        is_published: true
      - title: "La régression logistique"
        slug: regression-logistique
        file: iam-s1-classification/regression-logistique.md
        estimated_minutes: 25
        is_published: true
      - title: "Évaluer un classifieur"
        slug: evaluer-un-classifieur
        file: iam-s1-classification/evaluer-un-classifieur.md
        estimated_minutes: 25
        is_published: true
      - title: "TP 1 — Cancer du sein et régression logistique"
        slug: tp1-cancer-du-sein
        file: iam-s1-classification/tp1-cancer-du-sein.md
        kind: exercise
        estimated_minutes: 90
        is_published: true
      - title: "Défi 1 — Survie à 2 mois avec une régression logistique"
        slug: defi-1-survie
        file: iam-s1-classification/defi-1-survie.md
        kind: exercise
        estimated_minutes: 30
        is_published: true

  # ---------------------------------------------------------------- session 2
  # Source: session2/tp1.ipynb (breast_cancer_noisy.csv).
  - title: "Séance 2 — Préparer les données, forêts aléatoires"
    slug: iam-s2-preparation-forets
    icon: database
    visibility: unlisted
    summary: >
      Des données réelles sont imparfaites : valeurs manquantes, valeurs
      aberrantes, variables catégorielles, échelles différentes. On les prépare
      sans fuite d'information, puis on entraîne une forêt aléatoire et on
      règle ses hyperparamètres.
    competitions:
      - competition_id: 200
        label: "Survie à 2 mois — défi de la séance 2"
    lessons:
      - title: "Préparer des données imparfaites"
        slug: preparer-les-donnees
        file: iam-s2-preparation-forets/preparer-les-donnees.md
        estimated_minutes: 30
        is_published: true
      - title: "Arbres de décision et forêts aléatoires"
        slug: arbres-et-forets
        file: iam-s2-preparation-forets/arbres-et-forets.md
        estimated_minutes: 30
        is_published: true
      - title: "Hyperparamètres et validation croisée"
        slug: hyperparametres-validation
        file: iam-s2-preparation-forets/hyperparametres-validation.md
        estimated_minutes: 20
        is_published: true
      - title: "TP 2 — Données bruitées et forêt aléatoire"
        slug: tp2-donnees-bruitees
        file: iam-s2-preparation-forets/tp2-donnees-bruitees.md
        kind: exercise
        estimated_minutes: 90
        is_published: true
      - title: "Défi 2 — Survie à 2 mois avec une forêt aléatoire"
        slug: defi-2-survie
        file: iam-s2-preparation-forets/defi-2-survie.md
        kind: exercise
        estimated_minutes: 30
        is_published: true

  # ---------------------------------------------------------------- session 3
  # Source: session3/tp1.ipynb (heart disease, fetch_openml) + tp_bonus.ipynb.
  - title: "Séance 3 — Réseaux de neurones et comparaison de modèles"
    slug: iam-s3-reseaux-de-neurones
    icon: layers
    visibility: unlisted
    summary: >
      Le perceptron multicouche : neurones, couches, fonctions d'activation,
      courbe d'apprentissage et arrêt précoce ; puis la comparaison honnête de
      trois modèles sur un nouveau jeu de données (maladie cardiaque).
    competitions:
      - competition_id: 201
        label: "Survie à 2 mois — défi de la séance 3"
    lessons:
      - title: "Les réseaux de neurones"
        slug: reseaux-de-neurones
        file: iam-s3-reseaux-de-neurones/reseaux-de-neurones.md
        estimated_minutes: 30
        is_published: true
      - title: "Entraîner un réseau : courbe de perte et arrêt précoce"
        slug: entrainer-un-reseau
        file: iam-s3-reseaux-de-neurones/entrainer-un-reseau.md
        estimated_minutes: 25
        is_published: true
      - title: "Comparer des modèles"
        slug: comparer-des-modeles
        file: iam-s3-reseaux-de-neurones/comparer-des-modeles.md
        estimated_minutes: 20
        is_published: true
      - title: "TP 3 — Maladie cardiaque et réseaux de neurones"
        slug: tp3-maladie-cardiaque
        file: iam-s3-reseaux-de-neurones/tp3-maladie-cardiaque.md
        kind: exercise
        estimated_minutes: 90
        is_published: true
      - title: "TP bonus — La descente de gradient pas à pas"
        slug: tp-bonus-descente-de-gradient
        file: iam-s3-reseaux-de-neurones/tp-bonus-descente-de-gradient.md
        kind: exercise
        estimated_minutes: 45
        is_published: true
      - title: "Défi 3 — Survie à 2 mois avec un réseau de neurones"
        slug: defi-3-survie
        file: iam-s3-reseaux-de-neurones/defi-3-survie.md
        kind: exercise
        estimated_minutes: 30
        is_published: true

  # ---------------------------------------------------------------- project
  # Source: project/project.ipynb, refocused on challenge 172 itself (SUPPORT2,
  # alive/dead at 2 months, accuracy): the same task as the session challenges,
  # pushed further and presented in pairs.
  - title: "Projet — Survie à 2 mois : aller plus loin"
    slug: iam-projet
    icon: trophy
    visibility: unlisted
    summary: >
      Projet en binôme (un étudiant en médecine, un en apprentissage
      automatique) : dépasser les modèles des séances pour prédire la survie à
      2 mois de patients de réanimation, puis présenter le problème, la méthode
      et les résultats.
    competitions:
      - competition_id: 172
        label: "Survie à 2 mois — le défi du projet"
    lessons:
      - title: "Le projet : aller plus loin sur la survie à 2 mois"
        slug: projet-survie
        file: iam-projet/projet-survie.md
        kind: exercise
        estimated_minutes: 60
        is_published: true
