# Python AI Engineering — 12h (4 × 3h)
#
# Single source of truth for this module. Drives two outputs:
#   * PPTX decks      -> tools/build_slides.py    (one deck per module below)
#   * ML-Arena course -> tools/publish_mlarena.py (course / module / lesson rows)
#
# Ordering is this file's job: lesson `file` paths are explicit, so the
# directory layout stays flat and slug-named (round-trips with the SDK's
# export_course_to_dir).

course:
  name: "MS2A - AI Engineering"
  code: "PAIE-12"
  slug: python-ai-engineering
  visibility: public
  instructor_name: "Raphael Cousin"
  # PLACEHOLDER — the module is front-loaded into a single week; set the real
  # dates before the first publish.
  start_date: "2026-09-07"
  end_date: "2026-09-11"
  description: |
    A 12-hour mise à niveau in four 3-hour sessions, taken before
    *MS2A - Machine Learning Practice*. It assumes you already write Python and
    builds the engineering floor the rest of the year stands on: version
    control, reproducible environments, an agentic coding workflow, the
    vocabulary of applied machine learning, and PyTorch.

    Every session is half lecture, half lab. You finish the module with a
    packaged, tested, version-controlled Python project that trains a neural
    network — and a submission on ML-Arena.

modules:
  # ---------------------------------------------------------------- session 1
  #
  # Rebuilt 2026-09-06. This module is the whole engineering floor and it is
  # deliberately over-provisioned: ~11h of written material against a 3h slot,
  # so the teacher chooses what to lecture rather than what to invent. The 3h
  # core path, the extensions and the run-sheet are in `session-plan.md`
  # (unpublished). Every lesson carries a `# core` or `# extension` marker below,
  # which is the greppable version of the same decision.
  #
  # Three labs, all graded from a GitHub URL: ship a package (1), pull request
  # and review (2), agent-driven feature (3). The two attached competitions are
  # optional parts of labs 1 and 3, not requirements — the assessment for this
  # session lives on the students' GitHub accounts.
  #
  # `github-actions` and `ide-syntax-linting` kept their slugs (server lessons
  # 139 and 140) but are no longer `Reference — …`: both are now taught, and
  # both were rewritten for it. `lab-2` was the agent lab and is now the
  # pull-request lab; the agent lab is the new `lab-3`.
  - title: "Session 1 — The Engineering Floor"
    slug: s1-git-and-packaging
    icon: git-branch
    visibility: unlisted
    summary: >
      Shell, git, GitHub, environments, packaging, tests, linting, CI, notebooks
      and Colab — then an agentic coding workflow on top of them. You leave with
      a tested Python package on GitHub whose tests run themselves, and a Colab
      notebook that installs it.
    lessons:
      - title: "What Session 1 Builds"
        slug: session-map
        file: s1-git-and-packaging/session-map.md
        estimated_minutes: 10
        is_published: true            # core
      - title: "Accounts & Toolchain"
        slug: accounts-and-tools
        file: s1-git-and-packaging/accounts-and-tools.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "The Shell"
        slug: the-shell
        file: s1-git-and-packaging/the-shell.md
        estimated_minutes: 40
        is_published: true            # core
      - title: "Why Version Control"
        slug: why-version-control
        file: s1-git-and-packaging/why-version-control.md
        estimated_minutes: 10
        is_published: true            # core
      - title: "Git Essentials"
        slug: git-essentials
        file: s1-git-and-packaging/git-essentials.md
        estimated_minutes: 40
        is_published: true            # core
      - title: "Branching & Merging"
        slug: branching-and-collaboration
        file: s1-git-and-packaging/branching-and-collaboration.md
        estimated_minutes: 45
        is_published: true            # core
      - title: "Pull Requests & Code Review"
        slug: pull-requests-and-review
        file: s1-git-and-packaging/pull-requests-and-review.md
        estimated_minutes: 35
        is_published: true            # core
      - title: "Python Environments"
        slug: python-environments
        file: s1-git-and-packaging/python-environments.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "Packaging & Tests"
        slug: packaging-and-tests
        file: s1-git-and-packaging/packaging-and-tests.md
        estimated_minutes: 35
        is_published: true            # core
      - title: "Code Quality: Linting, Formatting & Types"
        slug: ide-syntax-linting
        file: s1-git-and-packaging/ide-syntax-linting.md
        estimated_minutes: 30
        is_published: true            # extension
      - title: "Continuous Integration with GitHub Actions"
        slug: github-actions
        file: s1-git-and-packaging/github-actions.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "Notebooks & Colab"
        slug: notebooks-and-colab
        file: s1-git-and-packaging/notebooks-and-colab.md
        estimated_minutes: 35
        is_published: true            # core
      - title: "Lab 1 — Ship a Package to GitHub"
        slug: lab-1
        kind: exercise
        file: s1-git-and-packaging/lab-1.md
        estimated_minutes: 60
        is_published: true            # core
      - title: "Lab 2 — Pull Request & Review"
        slug: lab-2
        kind: exercise
        file: s1-git-and-packaging/lab-2.md
        estimated_minutes: 45
        is_published: true            # core
      # -- the agentic-coding block. Placed after the labs on purpose: an agent
      # that edits a repository is only safe on top of a branch, a test suite
      # and a review habit, and the student now has all three.
      - title: "The Coding-Assistant Landscape"
        slug: assistant-landscape
        file: s1-git-and-packaging/assistant-landscape.md
        estimated_minutes: 25
        is_published: true            # extension
      - title: "What Actually Changed"
