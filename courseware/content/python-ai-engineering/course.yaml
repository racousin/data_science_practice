        estimated_minutes: 45
        is_published: true            # extension
      # -- self-study, never lectured. `in_deck: false` keeps them out of the
      # deck; the title is what tells a student they are not class material.
      - title: "Reference — GitHub Desktop"
        slug: github-desktop
        file: s1-git-and-packaging/github-desktop.md
        estimated_minutes: 10
        is_published: true
        in_deck: false
      - title: "Reference — Git Cheatsheet"
        slug: git-cheatsheet
        file: s1-git-and-packaging/git-cheatsheet.md
        estimated_minutes: 5
        is_published: true
        in_deck: false
      # The course reads a CSV, reshapes it and plots it from session 2 onward
      # and taught neither library anywhere; the 30h module that does teach them
      # runs afterwards. Scope is the intersection of "what this course actually
      # calls" and nothing else. Companion Colab: aie-s0-pandas-seaborn.ipynb.
      - title: "Reference — pandas & seaborn"
        slug: pandas-and-seaborn
        file: s1-git-and-packaging/pandas-and-seaborn.md
        estimated_minutes: 30
        is_published: true
        in_deck: false
      # The teacher's run-sheet for this module: the 3h core path, the cut list,
      # the live demos, and what to do when the room is behind. Not teaching
      # material — out of the student view and out of the deck.
      - title: "Session Plan — Teacher's Run-Sheet"
        slug: session-plan
        file: s1-git-and-packaging/session-plan.md
        estimated_minutes: 10
        is_published: false
        in_deck: false
    # Both are OPTIONAL parts of their labs, not requirements. Session 1 is
    # assessed from the students' GitHub repositories; these exist because a
    # measured leaderboard is a cheap outside opinion on a pinned specification.
    competitions:
      - competition_id: 179
        label: "textstats correctness (optional, Lab 1)"
      - competition_id: 180
        label: "Flesch reading-ease (optional, Lab 3)"

  # ---------------------------------------------------------------- session 2
  #
  # Built 2026-09-05 from the taught deck "module 2 - data / ml objective /
  # model training / visualization / basic preprocessing / sklearn" (73 slides,
  # pptxs/). Takes the slot left by "Session 3 - Data Science in a Nutshell"
  # (server module #16).
  #
  # Restructured 2026-09-05 (second pass) along the chain the session actually
  # teaches: data -> model -> loss -> training -> the two regressions ->
  # preparation. `the-ml-pipeline` was cut (its one durable message, rules
  # written vs rules learned, closes the landscape lesson); its (n, p) material
  # and all of `supervised-learning-setup` are folded into `the-data`;
  # `models-and-objectives` split into `models` + `losses`; `gradient-descent`
  # became `training`. Retired slugs still live server-side and are deleted at
  # publish time. "Check yourself" sections were dropped course-wide.
  #
  # Module slugs are immutable server-side, so this is a new module and #16 has
  # to be deleted at publish time, BEFORE reorder_modules.
  - title: "Session 2 — Machine Learning Foundations"
    slug: s2-ml-foundations
    icon: chart-line
    visibility: unlisted
    summary: >
      What machine learning is, stated precisely: the data, the model, the loss,
      and the training that connects them — then linear and logistic regression
      end to end in scikit-learn, and the data preparation they both assume.
