        is_published: true            # core
      - title: "Assistant Setup"
        slug: setup
        file: s1-git-and-packaging/setup.md
        estimated_minutes: 20
        is_published: true            # core
      - title: "The Core Loop"
        slug: the-core-loop
        file: s1-git-and-packaging/the-core-loop.md
        estimated_minutes: 35
        is_published: true            # core
      - title: "Context Engineering"
        slug: context-engineering
        file: s1-git-and-packaging/context-engineering.md
        estimated_minutes: 30
        is_published: true            # extension
      - title: "Guardrails & Review"
