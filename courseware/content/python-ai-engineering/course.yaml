      # `branching-and-collaboration` and the lab asked for a skill the session
      # no longer taught. `delete_lesson(136)` must run BEFORE the next publish.
      - title: "Lab 1 — Ship a Package to GitHub"
        slug: lab-1
        kind: exercise
        file: s1-git-and-packaging/lab-1.md
        estimated_minutes: 75
        is_published: true            # core
      # -- the agentic-coding block, now ONE lesson. `what-actually-changed`
