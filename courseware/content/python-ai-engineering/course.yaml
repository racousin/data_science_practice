        estimated_minutes: 30
        is_published: true
      # Moved here from session 3 (server lesson 153) on 2026-09-08. It defines
      # what "better" means, and every session before this one already needed
      # it: the two challenges attached below are ranked on -MAE and F1, and
      # `losses` two lessons up ends on the loss/metric distinction it is the
      # other half of. Placed after both regressions because it scores both.
      # A NEW lesson server-side — a lesson slug lives under its module — so
      # `delete_lesson(153)` must run BEFORE the next publish, or
      # `reorder_lessons` rejects session 3's manifest. Session 2 goes to 300
      # written minutes and session 3 down to 300; both were already over the
      # 3h slot, and neither is triaged here.
      - title: "Evaluation Metrics"
        slug: evaluation-metrics
        file: s2-ml-foundations/evaluation-metrics.md
        estimated_minutes: 40
        is_published: true
      # `Reference — pandas & seaborn` (lesson 180, moved here from session 1 on
      # 2026-09-06) was merged into this one on 2026-09-08 and deleted from the
      # server. It was self-study nobody did, and the API it documented is only
      # worth reading next to the problem it solves — so the pandas and seaborn
      # each section needs now sits in front of that section, and the five
      # imputation strategies it used to compete with are gone. Surviving slug
      # is `data-preparation`: slugs are immutable server-side.
      # Companion Colab: aie-s0-pandas-seaborn.ipynb.
      # A fourth part — feature engineering — was added on 2026-09-08 (45 -> 55).
      # The taught deck lists it as step 6 of preprocessing and has no slide
      # behind it, so it is authored here; it closes on the leakage rule, which
      # is what makes the other three parts safe. Its one figure is drawn by
      # `hour_numeric_vs_onehot()` in tools/figures/s2_ml_foundations.py from the
      # bike-demand CSVs, so the -138.9 -> -100.3 claim is the committed data's.
      - title: "Data Preparation"
        slug: data-preparation
        file: s2-ml-foundations/data-preparation.md
        estimated_minutes: 55
        is_published: true
      # Added 2026-09-09. The session had lectures and two attached challenges
      # and nothing that told a student to do them, so the challenges were
      # optional by omission. Three sections: the two challenges (short — the
      # notebooks carry the work, the lab only points at them and states the
      # bar), then the one that is actually new. Section 3 has the student
      # extract the code they have now written twice into an installable
      # package, `dskit`, which is Session 1's `textstats` skeleton with real
      # code in it: same src/ layout, same pytest, same CI, same
      # install-from-GitHub into Colab. Session 3's lab completes it —
      # cross-validation, model comparison, hyperparameter search — so the
      # package is left deliberately short of a `models.py`.
      #
      # `overview`, `target_by_category` and `target_by_bins` are written out in
      # full; the rest of the file is a signature table. Every number quoted was
      # measured against the committed CSVs in competitions/s2-*/data/, not
      # copied from the lesson bodies: bike time-holdout -146.32, the same with
      # `hour` as strings -108.21 (the "worth 38 MAE" claim), the random holdout
      # -97.09 (the 49 MAE of flattery), bank positive rate 0.1170, and the
      # three printed tables (bank `overview`, bike `hour` bins, bank `age`
      # bins). `target_by_bins` on `pdays` returning two bins instead of ten is
      # real `qcut` behaviour on a column that is 90% -1, kept as a lesson
      # rather than fixed.
      #
      # 75 minutes is the whole lab; only section 1 is meant for the room. That
      # takes the module to 375 written minutes against a 3h slot — it was
      # already at 300 and is not triaged here either.
      - title: "Lab 1 — Two Challenges and a Toolkit"
        slug: lab-1
        kind: exercise
        file: s2-ml-foundations/lab-1.md
        estimated_minutes: 75
        is_published: true
    # Two challenges, one per model family taught here: bike demand exercises
    # linear regression, bank term deposit exercises logistic regression. Both
    # are file_v1 (upload a CSV). Packages in competitions/s2-bike-demand and
    # competitions/s2-bank-marketing; the worked and guided Colab notebooks are
    # generated by tools/build_notebooks.py.
    # 183 was rebuilt on 2026-09-08: its split went from random to chronological
    # (a random split over hourly data let the model interpolate between hours it
    # had already seen — worth about 35 MAE of flattery), the features gained
    # deliberate missing values, and R2 was dropped so -MAE is the only number.
    # Every id changed with it, so the refresh cleared the board.
    competitions:
      - competition_id: 183
        label: "Bike Sharing Demand"
      - competition_id: 184
        label: "Bank Term Deposit"

