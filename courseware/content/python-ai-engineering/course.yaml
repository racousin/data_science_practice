  # teaches: data -> model -> loss -> training -> the two regressions ->
  # preparation. `the-ml-pipeline` was cut (its one durable message, rules
  # written vs rules learned, closes the landscape lesson); its (n, p) material
  # and all of `supervised-learning-setup` are folded into `the-data`;
  # `models-and-objectives` split into `models` + `losses`; `gradient-descent`
  # became `training`. Retired slugs still live server-side and are deleted at
  # publish time. "Check yourself" sections were dropped course-wide.
  #
  # Module slugs are immutable server-side, so this is a new module and #16 has
  # to be deleted at publish time, BEFORE reorder_modules.
  - title: "Session 2 — Machine Learning Foundations"
    slug: s2-ml-foundations
    icon: chart-line
    visibility: unlisted
    summary: >
      What machine learning is, stated precisely: the data, the model, the loss,
      and the training that connects them — then linear and logistic regression
      end to end in scikit-learn, the metrics that say which one is better, and
      the data preparation they both assume.
