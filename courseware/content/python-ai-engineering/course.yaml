        file: s1-git-and-packaging/accounts-and-tools.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "The Shell"
        slug: the-shell
        file: s1-git-and-packaging/the-shell.md
        estimated_minutes: 40
        is_published: true            # core
      # `why-version-control` (server lesson 28) merged in here 2026-09-06: the
      # motivation and the three-trees model now open the lesson whose commands
      # they explain, and its two figures moved to assets/git-essentials/.
      - title: "Git Essentials"
        slug: git-essentials
        file: s1-git-and-packaging/git-essentials.md
        estimated_minutes: 45
        is_published: true            # core
      # `pull-requests-and-review` (176) and `Reference — GitHub Desktop` (138)
      # merged in here 2026-09-06. Branching and the pull request were one
      # workflow taught as two lessons, and the GUI was a reference page nobody
      # was sent to; it is now the last two slides of the lesson it belongs to.
      - title: "Branching, Pull Requests & Review"
        slug: branching-and-collaboration
        file: s1-git-and-packaging/branching-and-collaboration.md
        estimated_minutes: 60
        is_published: true            # core
      - title: "Python Environments"
        slug: python-environments
        file: s1-git-and-packaging/python-environments.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "Packaging & Tests"
