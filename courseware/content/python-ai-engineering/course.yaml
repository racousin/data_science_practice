        estimated_minutes: 30
        is_published: true
      - title: "Losses"
        slug: losses
        file: s2-ml-foundations/losses.md
        estimated_minutes: 30
        is_published: true
      - title: "Training"
        slug: training
        file: s2-ml-foundations/training.md
        estimated_minutes: 40
        is_published: true
      - title: "Linear Regression"
        slug: linear-regression
        file: s2-ml-foundations/linear-regression.md
        estimated_minutes: 30
