      # nobody was sent to it; `git-essentials` carries the commands it listed.
      # The file is gone from s1-git-and-packaging/ with it.
      # The teacher's run-sheet for this module: the 3h core path, the cut list,
      # the live demos, and what to do when the room is behind. Not teaching
      # material — out of the student view and out of the deck.
      - title: "Session Plan — Teacher's Run-Sheet"
        slug: session-plan
        file: s1-git-and-packaging/session-plan.md
        estimated_minutes: 10
        is_published: false
        in_deck: false
    # One challenge, and unlike 179/180 it is a REQUIRED part of its lab. It is
    # the only thing in this session a student cannot mark themselves: an ELO
    # board scores your agent against other people's, so a plausible-looking
    # agent loses in public. Competitions 179 (PAIE S1 — textstats) and 180
