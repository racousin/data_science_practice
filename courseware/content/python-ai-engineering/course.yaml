        slug: github-actions
        file: s1-git-and-packaging/github-actions.md
        estimated_minutes: 30
        is_published: true            # core
      - title: "Notebooks & Colab"
        slug: notebooks-and-colab
        file: s1-git-and-packaging/notebooks-and-colab.md
        estimated_minutes: 35
        is_published: true            # core
      # `lab-2` ("Pull Request & Review", server lesson 136) merged in here
      # 2026-09-06. Lab 1 was a solo lab followed by a lab that needed a
      # partner; it is now one group lab. The body is Lab 1's, unchanged in
      # substance — what was added is the split: groups of 2 or 3, one or more
