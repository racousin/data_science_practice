      The engineering floor: version control, reproducible Python projects, an
      agentic coding workflow, and the three environments the rest of the course
      runs in — terminal, notebook kernel, hosted Colab runtime.
    lessons:
      - title: "Why Version Control"
        slug: why-version-control
        file: s1-git-and-packaging/why-version-control.md
        estimated_minutes: 10
        is_published: true
