# Python AI Engineering — 12h (4 × 3h)
#
# Single source of truth for this module. Drives two outputs:
#   * PPTX decks      -> tools/build_slides.py    (one deck per module below)
#   * ML-Arena course -> tools/publish_mlarena.py (course / module / lesson rows)
#
# Ordering is this file's job: lesson `file` paths are explicit, so the
# directory layout stays flat and slug-named (round-trips with the SDK's
# export_course_to_dir).

course:
  name: "MS2A - AI Engineering"
  code: "MS2A-AIE-2026"
  slug: python-ai-engineering
  visibility: public
  instructor_name: "Raphael Cousin"
  # PLACEHOLDER — the module is front-loaded into a single week; set the real
  # dates before the first publish.
  start_date: "2026-09-07"
  end_date: "2026-09-11"
  description: |
    A 12-hour mise à niveau in four 3-hour sessions, taken before
    *MS2A - Machine Learning Practice*. It assumes you already write Python and
    builds the engineering floor the rest of the year stands on: version
    control, reproducible environments, an agentic coding workflow, the
    vocabulary of applied machine learning, and PyTorch.

    Every session is half lecture, half lab. You finish the module with a
    packaged, tested, version-controlled Python project that trains a neural
    network — and a submission on ML-Arena.

modules:
  # ---------------------------------------------------------------- session 1
  #
  # Rebuilt 2026-09-06, then consolidated 2026-09-06 (second pass). This module
  # is the whole engineering floor. The consolidation merged nine lessons into
  # three and took the module from 725 written minutes to 560 published (plus the
  # unpublished run-sheet) against a 3h slot:
  #
  #   why-version-control        -> git-essentials
  #   pull-requests-and-review   -> branching-and-collaboration
  #   github-desktop (reference) -> branching-and-collaboration
  #   what-actually-changed, setup, the-core-loop, context-engineering,
  #   guardrails-and-review      -> assistant-landscape (one agentic lesson)
  #
  # The surviving slug is the one kept because module slugs are immutable
  # server-side; the eight retired lessons (server ids 28, 176, 138, 131, 132,
  # 133, 134, 135) must be deleted with `delete_lesson` BEFORE the publish, or
  # `reorder_lessons` rejects the manifest. The 3h core path, the extensions and
  # the run-sheet are in `session-plan.md` (unpublished); every lesson below
  # carries a `# core` or `# extension` marker, the greppable version of the
  # same decision.
  #
  # Two labs, both read from a GitHub URL: ship a package as a group of 2-3,
  # each owning a function (1), and an agent-built Connect-Four player (2, slug
  # `lab-3`). Lab 2's challenge is the one competition attached to this module.
  # It WAS a required part of that lab; the 2026-09-07 website rewrite made the
  # lab optional self-study opening on a one-click Colab, so it is now the
  # session's extension, not core. An ELO board is still the only outside
  # opinion in the session that a student cannot self-mark — which is why it
  # stays attached even as homework.
  #
  # Trimmed again in the course editor on 2026-09-06, after the publish, and
  # pulled back into this repo with `make pull` the same day: `session-map`
  # deleted, `accounts-and-tools` retitled, and 248 lines cut from five bodies —
  # the whole review half of `branching-and-collaboration` among them. The
  # module went to 15 lessons / 550 published minutes, then to **14 lessons,
  # 520 published minutes** in a second pass that deleted `ide-syntax-linting`
  # and halved `github-actions`. Merging the two labs below took it to
  # **13 lessons, 490 published minutes**. The website is upstream of these
  # files for those changes, so run `make check-sync` before the next
  # publish, not after.
