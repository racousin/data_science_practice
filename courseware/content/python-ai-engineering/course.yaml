        is_published: true            # core
      # Retitled Lab 3 -> Lab 2 when the first two labs merged; the slug is
      # immutable server-side, so `lab-3` still names the second lab.
      # Rewritten in the course editor on 2026-09-07 and pulled back the same
      # day: the lab became optional self-study opening on a one-click Colab, so
      # it no longer costs a 45-minute room slot. 45 -> 30 follows that edit.
      - title: "Lab 2 — Ship an Agent to Connect Four"
        slug: lab-3
        kind: exercise
        file: s1-git-and-packaging/lab-3.md
        estimated_minutes: 30
        is_published: true            # extension
      # `Reference — Git Cheatsheet` (server lesson 141) was deleted in the
      # course editor and pulled down here on 2026-09-08, the same way
