    slug: s1-git-and-packaging
    icon: git-branch
    visibility: unlisted
    summary: >
      Shell, git, GitHub, environments, packaging, tests, linting, CI, notebooks
      and Colab — then an agentic coding workflow on top of them. You leave with
      a tested Python package on GitHub whose tests run themselves, a Colab
      notebook that installs it, and an agent on a leaderboard.
    lessons:
      # `session-map` ("What Session 1 Builds", server lesson 173) was deleted
      # in the course editor on 2026-09-06 and pulled down here the same day —
      # the module now opens on Accounts & Setup. Its two figures are still
      # drawn by `session_map()` in tools/figures/s1_git_and_packaging.py and
      # now have no lesson to land in; the function stays only so the material
      # is one `git revert` away.
      - title: "Accounts & Setup"     # retitled on the website, 2026-09-06
