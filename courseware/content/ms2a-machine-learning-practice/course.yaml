# MS2A - Machine Learning Practice — 33h (11 × 3h)
#
# Single source of truth for this module. Drives two outputs:
#   * PPTX decks      -> tools/build_slides.py    (one deck per module below)
#   * ML-Arena course -> tools/publish_mlarena.py (course / module / lesson rows)
#
# Structure follows CURRICULUM_PLAN.md §4. Sourced from the retired website
# courses: DSP m4–m9 + PDL m3–m4.

course:
  name: "MS2A - Machine Learning Practice"
  code: "MS2A-MLP-2026"
  slug: ms2a-machine-learning-practice
  visibility: public
  instructor_name: "Raphael Cousin"
  # PLACEHOLDER — 10 weeks, 2 × 3h per week. Set the real term dates before the
  # first published run.
  start_date: "2026-09-14"
  end_date: "2026-11-27"
  description: |
    A 30-hour applied machine learning course in eleven 3-hour sessions, taken
    after *Python AI Engineering*. It walks the full arc of a modern ML system:
    collecting and preparing data, tabular models, deep networks in PyTorch,
    computer vision, natural language processing and large language models,
    reinforcement learning, and deploying a trained model as a Docker image
    served by an API.

    Every session is half lecture, half lab. Half the grade is a project
    submitted to ML-Arena; the other half is continuous assessment across the
    eleven labs. You are expected to arrive with the engineering floor from the
    12-hour module: git, a packaged environment, tests, and a coding agent you
    know how to supervise.

